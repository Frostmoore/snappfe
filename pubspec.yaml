name: snapp
description: "App SNAPP — Sindacato Nazionale Agenti di assicurazione."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Stato
  flutter_riverpod: ^2.5.1

  # Routing + deep-link
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage sicuro (token)
  flutter_secure_storage: ^9.2.2

  # Autenticazione biometrica (impronta/volto) per sbloccare la sessione
  local_auth: ^2.3.0

  # Immagini remote con cache
  cached_network_image: ^3.4.1

  # Aprire link esterni (social, sito)
  url_launcher: ^6.3.1

  # WebView (form eventi WordPress)
  webview_flutter: ^4.10.0

  # Rendering NATIVO di HTML (area riservata: pagina "il mio account"), senza WebView
  flutter_widget_from_html_core: ^0.16.1

  # Aggiungere eventi al calendario del device
  add_2_calendar: ^3.0.1

  # Formattazione date in italiano
  intl: ^0.19.0

  # Icone brand dei social
  font_awesome_flutter: ^10.8.0

  # Icone social custom in SVG (con tinta)
  flutter_svg: ^2.0.10+1

  # Video header
  video_player: ^2.9.2

  # Login social (gateato da config finché non configurato)
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # Notifiche push (gateato: attive solo con ONESIGNAL_APP_ID configurato)
  onesignal_flutter: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generazione icona app e splash screen (build-time)
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# Icona app: genera android/ios da un'immagine sorgente.
# Comando: dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/branding/icon.png"          # 1024x1024, SENZA trasparenza
  android: true
  ios: true
  remove_alpha_ios: true
  # Icona adattiva Android (foreground trasparente + colore di sfondo)
  adaptive_icon_background: "#FFFFFF"              # <-- colore sfondo icona (hex)
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"  # logo ~65% centrale, trasparente

# ---------------------------------------------------------------------------
# Splash screen: genera le risorse native.
# Comando: dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#FFFFFF"                                 # <-- colore sfondo splash (hex)
  image: assets/branding/splash.png               # logo centrato, trasparente
  android_12:
    image: assets/branding/splash.png             # entro ~768x768 al centro
    color: "#FFFFFF"
  # Dark mode (opzionale): scommenta e aggiungi splash_dark.png
  # color_dark: "#16205A"
  # image_dark: assets/branding/splash_dark.png
